<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B10;--ink:#F4F4F5;--lime:#C6FF3D;--d:"Space Grotesk",sans-serif;--b:"Inter",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:clip;background:var(--bg);color:var(--ink);font-family:var(--b)}
nav{display:flex;justify-content:space-between;align-items:center;padding:32px 80px;font-size:17px}
nav .wm{font:700 24px var(--d)}nav b{background:var(--lime);color:#000;padding:12px 20px;border-radius:999px}
main{display:grid;grid-template-columns:6fr 6fr;padding:96px 80px 0;align-items:center}
h1{font:700 96px/1 var(--d);letter-spacing:-.03em}
p{font-size:22px;line-height:1.5;margin:28px 0 40px;color:#A1A1AA;max-width:520px}
a{background:var(--lime);color:#000;font:700 20px var(--d);padding:20px 32px;border-radius:999px;text-decoration:none}
.orb{justify-self:center;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E8FF9F,#C6FF3D 30%,#2a3a10 70%,transparent 72%);box-shadow:0 0 180px 40px rgba(198,255,61,.25)}
</style></head><body>
<nav><span class="wm">✦ Funkel Labs</span><span>Services · Work · About · 日本語 <b>Get in touch</b></span></nav>
<main><div><h1>We build software that sparks.</h1><p>From idea to shipped product. Web, mobile and AI for startups and SMBs.</p><a href="#">Get in touch</a></div><div class="orb"></div></main>
</body></html>
