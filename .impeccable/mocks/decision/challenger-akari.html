<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Akari Workshop</title>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;500&family=Zen+Kaku+Gothic+New:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--room:#2B2724;--washi:#F2E8D5;--rib:#C9A66B;--ink:#2B2A28;--verm:#D9411E;--f:"Albert Sans","Zen Kaku Gothic New",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:clip;background:radial-gradient(circle at 70% 48%,#7a6448 0,#3a322b 34%,var(--room) 62%);color:var(--washi);font-family:var(--f)}
nav{display:flex;justify-content:space-between;padding:36px 80px;font:300 18px var(--f)}
.wm{display:flex;gap:12px;align-items:center;font:500 22px var(--f)}
.stamp{display:grid;place-items:center;width:30px;height:30px;background:var(--verm);color:var(--washi);font:500 15px var(--f);border-radius:3px}
main{display:grid;grid-template-columns:6fr 6fr;padding:80px 80px 0;align-items:center}
h1{font:300 104px/1 var(--f);letter-spacing:-.025em}
p{font:300 24px/1.5 var(--f);margin:32px 0 44px;max-width:520px;opacity:.85}
a{display:inline-flex;gap:14px;align-items:center;background:var(--verm);color:var(--washi);font:500 22px var(--f);padding:20px 30px;border-radius:3px;text-decoration:none}
.lamp{justify-self:center;width:300px;height:520px;border-radius:150px/120px;background:radial-gradient(circle at 50% 50%,#FFF6DF 0,#F2E8D5 45%,#D8C5A0 100%);box-shadow:0 0 160px 60px rgba(255,220,160,.35);background-image:repeating-linear-gradient(0deg,transparent 0 38px,rgba(201,166,107,.55) 38px 40px),radial-gradient(circle at 50% 50%,#FFF6DF 0,#F2E8D5 45%,#D8C5A0 100%)}
</style></head><body>
<nav><div class="wm"><span class="stamp">火</span>Funkel Labs</div><span>Work · Services · Team · 日本語</span></nav>
<main><div><h1>Software that ships flat and lights up.</h1><p>From idea to shipped product, made carefully by a small studio in Tokyo.</p><a href="#">Get in touch</a></div><div class="lamp"></div></main>
</body></html>
